// Template de proyecto Android para TapMon.
// La version de AGP se fija para evitar resoluciones incompatibles durante la build.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
